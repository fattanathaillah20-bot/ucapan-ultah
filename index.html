<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selamat Ulang Tahun Laras!</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; overflow:hidden; font-family:'Poppins',sans-serif;
    background: radial-gradient(1200px 800px at 50% 18%, #2b0a2e 0%, #14001a 55%, #0a0010 100%); }

  /* ---------- bokeh lembut di latar ---------- */
  #bokeh span{ position:fixed; border-radius:50%; filter:blur(70px); opacity:.32; z-index:0;
    animation:apung 11s ease-in-out infinite alternate; }
  #bokeh span:nth-child(1){ width:340px;height:340px; left:-90px; top:-60px;  background:#ff4da6; }
  #bokeh span:nth-child(2){ width:280px;height:280px; right:-70px; top:12%;   background:#7a2bd8; animation-delay:-4s; }
  #bokeh span:nth-child(3){ width:300px;height:300px; left:8%;   bottom:-110px; background:#c44dff; animation-delay:-7s; }
  #bokeh span:nth-child(4){ width:240px;height:240px; right:6%;  bottom:-70px; background:#ff77b9; animation-delay:-2s; }
  @keyframes apung{ to{ transform:translate(34px,-44px) scale(1.15); } }

  /* ---------- bintang berkelip ---------- */
  .bintang{ position:fixed; width:2px; height:2px; background:#fff; border-radius:50%;
    z-index:1; pointer-events:none; animation:kelip 2.6s ease-in-out infinite; }
  @keyframes kelip{ 50%{ opacity:.12; transform:scale(.55); } }

  /* ---------- hujan hati ---------- */
  .hati{ position:fixed; top:0; width:var(--s); height:var(--s); z-index:2; pointer-events:none;
    animation:jatuh linear infinite; }
  .hati::before,.hati::after{ content:""; position:absolute; width:var(--s); height:var(--s);
    border-radius:50%; background:inherit; }
  .hati::before{ left:calc(var(--s) / -2); }
  .hati::after { top:calc(var(--s) / -2); }
  @keyframes jatuh{
    0%  { transform:translate(0,-6vh)    rotate(45deg); }
    25% { transform:translate(24px,22vh) rotate(45deg); }
    50% { transform:translate(-18px,52vh) rotate(45deg); }
    75% { transform:translate(18px,82vh) rotate(45deg); }
    100%{ transform:translate(0,112vh)   rotate(45deg); }
  }

  /* ---------- balon ---------- */
  .balon{ position:fixed; left:var(--x); bottom:-170px; width:74px; height:92px; z-index:2;
    pointer-events:none; border-radius:50% / 55% 55% 45% 45%;
    background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.75), rgba(255,255,255,0) 45%), var(--c);
    box-shadow:0 0 42px -8px var(--c);
    animation:terbang var(--d) linear infinite; animation-delay:var(--dl); }
  .balon::before{ content:""; position:absolute; left:50%; bottom:-9px; transform:translateX(-50%);
    border:6px solid transparent; border-top:10px solid var(--c); }
  .balon::after{ content:""; position:absolute; left:50%; bottom:-90px; width:2px; height:80px;
    background:linear-gradient(rgba(255,255,255,.55), transparent); }
  @keyframes terbang{
    0%  { transform:translate(0,0); }
    25% { transform:translate(22px,-30vh); }
    50% { transform:translate(-16px,-60vh); }
    75% { transform:translate(16px,-92vh); }
    100%{ transform:translate(0,-135vh); }
  }

  /* ---------- teks ucapan ---------- */
  main{ position:fixed; inset:0; z-index:5; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:0 20px;
    transform:translateY(-70px); pointer-events:none; }
  .sub,.judul,.nama,.pesan{ opacity:0; transform:translateY(26px);
    transition:opacity 1.1s cubic-bezier(.2,.7,.2,1), transform 1.1s cubic-bezier(.2,.7,.2,1); }
  .sub{ color:#ffd1ec; font-weight:300; font-size:clamp(11px,2vw,15px);
    letter-spacing:.4em; text-transform:uppercase; }
  .judul{ font-weight:700; font-size:clamp(26px,5vw,54px); letter-spacing:.22em; margin:14px 0 2px;
    background:linear-gradient(90deg,#ff77b9,#ffd23f,#ff77b9);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 18px rgba(255,77,166,.45)); }
  .nama{ font-family:'Great Vibes',cursive; font-size:clamp(54px,10vw,110px); line-height:1.25;
    padding:0 30px;
    background:linear-gradient(180deg,#ffffff,#ffb3d9 55%,#ff4da6);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 26px rgba(255,77,166,.55)); }
  .pesan{ color:#ffffff; font-weight:300; font-size:clamp(13px,2.2vw,17px);
    max-width:540px; margin-top:8px; text-shadow:0 0 14px rgba(255,255,255,.25); }
  body.mulai .sub  { opacity:1; transform:none; transition-delay:.4s; }
  body.mulai .judul{ opacity:1; transform:none; transition-delay:1s; }
  body.mulai .nama { opacity:1; transform:none; transition-delay:1.6s; }
  body.mulai .pesan{ opacity:1; transform:none; transition-delay:2.2s; }

  /* ---------- kue ulang tahun ---------- */
  .kue{ position:fixed; left:50%; bottom:0; z-index:6; opacity:0;
    transform:translate(-50%,90px);
    transition:opacity 1.2s cubic-bezier(.2,.7,.2,1), transform 1.2s cubic-bezier(.2,.7,.2,1); }
  body.mulai .kue{ opacity:1; transform:translate(-50%,0); transition-delay:2.6s; }
  .kue::before{ content:""; position:absolute; left:50%; bottom:-34px; transform:translateX(-50%);
    width:540px; height:130px; z-index:-1;
    background:radial-gradient(closest-side, rgba(255,77,166,.35), transparent);
    filter:blur(10px); }
  .tingkat{ margin:0 auto; position:relative; border-radius:14px 14px 4px 4px;
    box-shadow:inset 0 -14px 24px rgba(0,0,0,.18); }
  .t1{ width:330px; height:96px; background:linear-gradient(180deg,#ff85c1,#ff4da6); }
  .t2{ width:250px; height:82px; background:linear-gradient(180deg,#ff9ecd,#ff69b4); }
  .t3{ width:180px; height:66px; background:linear-gradient(180deg,#ffb7dd,#ff85c1); }
  .krim{ position:absolute; top:0; left:0; right:0; height:16px; border-radius:14px 14px 0 0;
    background:linear-gradient(#ffffff,#ffe3f1); }
  .krim::after{ content:""; position:absolute; top:100%; left:0; right:0; height:14px;
    background-image:radial-gradient(circle at 14px -4px, #ffe3f1 13px, rgba(0,0,0,0) 14px);
    background-size:32px 14px; background-repeat:repeat-x; }
  .lilin{ position:absolute; bottom:242px; width:10px; height:44px; border-radius:4px; z-index:7;
    background:repeating-linear-gradient(45deg,#ffffff 0 5px,#ff9ecb 5px 10px); }
  .api{ position:absolute; left:50%; top:-17px; width:14px; height:20px;
    transform:translateX(-50%); transform-origin:50% 100%;
    background:radial-gradient(circle at 50% 70%, #fff3b0, #ffd23f 45%, #ff9f1c 82%);
    border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;
    box-shadow:0 0 18px 6px rgba(255,159,28,.55), 0 0 60px 26px rgba(255,77,166,.25);
    animation:kedip .22s ease-in-out infinite alternate; }
  @keyframes kedip{
    from{ transform:translateX(-50%) scale(1) rotate(-2.5deg); }
    to  { transform:translateX(-50%) scale(1.12,1.3) rotate(2.5deg); }
  }
  .piring{ width:430px; height:20px; margin:0 auto; border-radius:50%/100%;
    background:linear-gradient(#7a3f8f,#5c2751); box-shadow:0 12px 40px rgba(0,0,0,.55); }

  /* ---------- konfeti ---------- */
  #confetti{ position:fixed; inset:0; z-index:40; pointer-events:none; }

  /* ---------- tombol musik ---------- */
  #tombol-musik{ position:fixed; top:18px; right:18px; z-index:60; width:46px; height:46px;
    border-radius:50%; border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.08); backdrop-filter:blur(6px);
    color:#fff; font-size:20px; cursor:pointer; opacity:0; transition:opacity .8s 1.2s; }
  body.mulai #tombol-musik{ opacity:1; }

  .jejak{ position:fixed; left:16px; bottom:12px; z-index:5; color:#b366ff;
    font-weight:300; font-size:11px; letter-spacing:.18em; opacity:.85; }

  /* ---------- sampul pembuka ---------- */
  #sampul{ position:fixed; inset:0; z-index:50; display:flex; align-items:center;
    justify-content:center; cursor:pointer;
    background:radial-gradient(1000px 700px at 50% 40%, #3a0d3f 0%, #14001a 70%);
    transition:opacity 1s, visibility 1s; }
  #sampul.hilang{ opacity:0; visibility:hidden; }
  .kado{ text-align:center; animation:memantul 1.6s ease-in-out infinite; }
  .kado .emoji{ font-size:92px; filter:drop-shadow(0 0 30px rgba(255,77,166,.65)); }
  .kado p{ color:#ffd1ec; letter-spacing:.25em; font-weight:300; margin-top:18px;
    font-size:clamp(12px,2vw,16px); text-transform:uppercase; }
  @keyframes memantul{ 50%{ transform:translateY(-14px); } }
</style>
</head>
<body>
  <div id="bokeh"><span></span><span></span><span></span><span></span></div>

  <main>
    <p class="sub">Hari ini istimewa, karena</p>
    <h1 class="judul">SELAMAT ULANG TAHUN</h1>
    <div class="nama">Laras</div>
    <p class="pesan">Panjang umur, sehat, dan bahagia selalu!</p>
  </main>

  <div class="kue">
    <div class="lilin" style="left:calc(50% - 55px)"><div class="api"></div></div>
    <div class="lilin" style="left:calc(50% - 5px)"><div class="api"></div></div>
    <div class="lilin" style="left:calc(50% + 45px)"><div class="api"></div></div>
    <div class="tingkat t3"><div class="krim"></div></div>
    <div class="tingkat t2"><div class="krim"></div></div>
    <div class="tingkat t1"><div class="krim"></div></div>
    <div class="piring"></div>
  </div>

  <div class="balon" style="--x:6%;  --c:#ff4da6; --d:15s; --dl:-2s"></div>
  <div class="balon" style="--x:16%; --c:#c44dff; --d:18s; --dl:-9s"></div>
  <div class="balon" style="--x:80%; --c:#4dc3ff; --d:16s; --dl:-5s"></div>
  <div class="balon" style="--x:90%; --c:#ffd23f; --d:19s; --dl:-12s"></div>
  <div class="balon" style="--x:70%; --c:#7bff9e; --d:17s; --dl:-7s"></div>

  <canvas id="confetti"></canvas>
  <button id="tombol-musik" title="Musik">&#x1F50A;</button>
  <p class="jejak">DIBUAT DENGAN PYTHON &amp; CINTA</p>

  <div id="sampul">
    <div class="kado">
      <div class="emoji">&#x1F381;</div>
      <p>Ketuk untuk membuka</p>
    </div>
  </div>

<script>
  var WARNA = ['#ff4da6', '#ff77b9', '#ff99cc', '#ff3385', '#ffc2e0', '#ffd23f'];

  // ---------- bintang ----------
  for (var i = 0; i < 90; i++) {
    var b = document.createElement('div');
    b.className = 'bintang';
    b.style.left = Math.random() * 100 + 'vw';
    b.style.top = Math.random() * 100 + 'vh';
    b.style.animationDelay = (Math.random() * 2.6) + 's';
    document.body.appendChild(b);
  }

  // ---------- hujan hati ----------
  for (var j = 0; j < 26; j++) {
    var h = document.createElement('div');
    h.className = 'hati';
    var ukuran = 9 + Math.random() * 15;
    var durasi = 7 + Math.random() * 7;
    h.style.setProperty('--s', ukuran + 'px');
    h.style.left = Math.random() * 100 + 'vw';
    h.style.background = WARNA[Math.floor(Math.random() * WARNA.length)];
    h.style.opacity = 0.35 + Math.random() * 0.6;
    h.style.animationDuration = durasi + 's';
    h.style.animationDelay = (-Math.random() * durasi) + 's';
    document.body.appendChild(h);
  }

  // ---------- konfeti ----------
  var kanvas = document.getElementById('confetti');
  var ctx = kanvas.getContext('2d');
  var potongan = [];
  var konfetiJalan = false;
  function ukurKanvas() { kanvas.width = innerWidth; kanvas.height = innerHeight; }
  ukurKanvas();
  addEventListener('resize', ukurKanvas);

  function buatKonfeti(n) {
    for (var k = 0; k < n; k++) {
      potongan.push({
        x: Math.random() * kanvas.width,
        y: -20 - Math.random() * kanvas.height,
        w: 6 + Math.random() * 6,
        h: 8 + Math.random() * 8,
        c: WARNA[Math.floor(Math.random() * WARNA.length)],
        v: 1 + Math.random() * 2.5,
        r: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.15,
        g: Math.random() * Math.PI * 2
      });
    }
  }

  function gambarKonfeti() {
    ctx.clearRect(0, 0, kanvas.width, kanvas.height);
    for (var m = 0; m < potongan.length; m++) {
      var p = potongan[m];
      p.y += p.v; p.g += 0.03; p.x += Math.sin(p.g) * 0.8; p.r += p.vr;
      if (p.y > kanvas.height + 20) { p.y = -20; p.x = Math.random() * kanvas.width; }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.r);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    requestAnimationFrame(gambarKonfeti);
  }

  // ---------- musik: Happy Birthday (WebAudio) ----------
  var NADA = { G4:392.00, A4:440.00, B4:493.88, C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99 };
  var LAGU = [
    ['G4',.4],['G4',.2],['A4',.6],['G4',.6],['C5',.6],['B4',1.1],
    ['G4',.4],['G4',.2],['A4',.6],['G4',.6],['D5',.6],['C5',1.1],
    ['G4',.4],['G4',.2],['G5',.6],['E5',.6],['C5',.6],['B4',.6],['A4',1.1],
    ['F5',.4],['F5',.2],['E5',.6],['C5',.6],['D5',.6],['C5',1.6]
  ];
  var ac = null, bermain = false, sumber = [], pengulang = null;
  var tombol = document.getElementById('tombol-musik');

  function mainkan() {
    berhenti();
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    bermain = true;
    tombol.innerHTML = '&#x1F50A;';
    var t = ac.currentTime + 0.1;
    for (var n = 0; n < LAGU.length; n++) {
      var o = ac.createOscillator();
      var g = ac.createGain();
      o.type = 'triangle';
      o.frequency.value = NADA[LAGU[n][0]];
      var d = LAGU[n][1];
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.18, t + 0.03);
      g.gain.setTargetAtTime(0, t + d - 0.06, 0.05);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + d + 0.1);
      sumber.push(o);
      t += d;
    }
    var total = (t - ac.currentTime) * 1000;
    pengulang = setTimeout(function () { if (bermain) mainkan(); }, total + 900);
  }

  function berhenti() {
    bermain = false;
    clearTimeout(pengulang);
    for (var s = 0; s < sumber.length; s++) { try { sumber[s].stop(); } catch (e) {} }
    sumber = [];
    tombol.innerHTML = '&#x1F507;';
  }

  tombol.addEventListener('click', function (e) {
    e.stopPropagation();
    if (bermain) berhenti(); else mainkan();
  });

  // ---------- buka sampul ----------
  function buka() {
    document.getElementById('sampul').classList.add('hilang');
    document.body.classList.add('mulai');
    if (!konfetiJalan) { konfetiJalan = true; buatKonfeti(140); gambarKonfeti(); }
    mainkan();
  }
  document.getElementById('sampul').addEventListener('click', buka);
  if (location.hash === '#langsung') buka(); // pratinjau cepat tanpa klik
</script>
</body>
</html>
